services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartredirect
      POSTGRES_USER: smartredirect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartredirect -d smartredirect"]
      interval: 5s
      timeout: 3s
      retries: 10
  application:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports: ["5000:5000"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres-data:
