apiVersion: v1
kind: Secret
metadata:
  name: smartredirect-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://smartredirect:CHANGE_ME@postgresql:5432/smartredirect
  SESSION_SECRET: CHANGE_ME_AT_LEAST_32_RANDOM_CHARACTERS
  ADMIN_PASSWORD: CHANGE_ME_AT_LEAST_12_CHARACTERS
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartredirect
spec:
  replicas: 2
  selector:
    matchLabels: { app: smartredirect }
  template:
    metadata:
      labels: { app: smartredirect }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: application
          image: ghcr.io/example/smartredirectsuite:2.22.0
          ports: [{ name: http, containerPort: 5000 }]
          envFrom: [{ secretRef: { name: smartredirect-secrets } }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: COOKIE_SECURE, value: "true" }
          readinessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 20, periodSeconds: 30 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: smartredirect
spec:
  selector: { app: smartredirect }
  ports: [{ name: http, port: 80, targetPort: http }]
